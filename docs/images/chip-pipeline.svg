<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="520" viewBox="0 0 1440 520" role="img" aria-label="04 · 芯片缺陷与位置度"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#1b998b"/></marker></defs><rect width="1440" height="520" rx="24" fill="#f0f5f8"/><rect width="1440" height="145" rx="24" fill="#132c46"/><rect y="115" width="1440" height="30" fill="#132c46"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="54" y="66" font-size="34" font-weight="700" fill="white">04 · 芯片缺陷与位置度</text><text x="54" y="111" font-size="20" fill="#bdd3e1">实际启用流程：标定、模板定位、几何工具、位置度检测模型与缺陷分类模型</text><rect x="48" y="192" width="300" height="190" rx="16" fill="white" stroke="#d5e0e8"/><circle cx="83" cy="225" r="17" fill="#1b998b"/><text x="83" y="231" text-anchor="middle" font-size="17" fill="white">1</text><text x="112" y="233" font-size="23" font-weight="700" fill="#132c46">标定与定位</text><text x="72" y="278" font-size="19" fill="#455d70">图像转换 / 棋盘格标定</text><text x="72" y="309" font-size="19" fill="#455d70">模板匹配定位</text><text x="72" y="340" font-size="19" fill="#455d70">建立基准坐标关系</text><path d="M357 288 H386" stroke="#1b998b" stroke-width="3" marker-end="url(#a)"/><rect x="396" y="192" width="300" height="190" rx="16" fill="white" stroke="#d5e0e8"/><circle cx="431" cy="225" r="17" fill="#1b998b"/><text x="431" y="231" text-anchor="middle" font-size="17" fill="white">2</text><text x="460" y="233" font-size="23" font-weight="700" fill="#132c46">位置度处理</text><text x="420" y="278" font-size="19" fill="#455d70">滤波、找线、求交</text><text x="420" y="309" font-size="19" fill="#455d70">坐标转换与目标检测</text><text x="420" y="340" font-size="19" fill="#455d70">提取 X / Y 测量值</text><path d="M705 288 H734" stroke="#1b998b" stroke-width="3" marker-end="url(#a)"/><rect x="744" y="192" width="300" height="190" rx="16" fill="white" stroke="#d5e0e8"/><circle cx="779" cy="225" r="17" fill="#1b998b"/><text x="779" y="231" text-anchor="middle" font-size="17" fill="white">3</text><text x="808" y="233" font-size="23" font-weight="700" fill="#132c46">缺陷分类</text><text x="768" y="278" font-size="19" fill="#455d70">DLClassify-CPU</text><text x="768" y="309" font-size="19" fill="#455d70">卷线 / 连线 / 漏焊等</text><text x="768" y="340" font-size="19" fill="#455d70">保留原缺陷输出逻辑</text><path d="M1053 288 H1082" stroke="#1b998b" stroke-width="3" marker-end="url(#a)"/><rect x="1092" y="192" width="300" height="190" rx="16" fill="white" stroke="#d5e0e8"/><circle cx="1127" cy="225" r="17" fill="#1b998b"/><text x="1127" y="231" text-anchor="middle" font-size="17" fill="white">4</text><text x="1156" y="233" font-size="23" font-weight="700" fill="#132c46">结果分析与展示</text><text x="1116" y="278" font-size="19" fill="#455d70">X 标准 42.98 ± 1 mm</text><text x="1116" y="309" font-size="19" fill="#455d70">Y 标准 1.56 ± 1 mm</text><text x="1116" y="340" font-size="19" fill="#455d70">图像、结论与测量表</text><rect x="48" y="420" width="1344" height="62" rx="12" fill="#dfedf1"/><text x="70" y="458" font-size="20" fill="#24465b">标定文件随工程保留。更换相机、镜头、分辨率或拍摄条件后，必须重新检查标定和测量精度。</text></g></svg>
