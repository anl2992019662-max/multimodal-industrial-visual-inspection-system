<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="520" viewBox="0 0 1440 520" role="img" aria-label="02 · 线缆姿态调整"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#1b998b"/></marker></defs><rect width="1440" height="520" rx="24" fill="#f0f5f8"/><rect width="1440" height="145" rx="24" fill="#132c46"/><rect y="115" width="1440" height="30" fill="#132c46"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="54" y="66" font-size="34" font-weight="700" fill="white">02 · 线缆姿态调整</text><text x="54" y="111" font-size="20" fill="#bdd3e1">图像坐标：X 向右、Y 向下；原始 C# 脚本已单独提取，便于阅读与验证</text><rect x="48" y="192" width="300" height="190" rx="16" fill="white" stroke="#d5e0e8"/><circle cx="83" cy="225" r="17" fill="#1b998b"/><text x="83" y="231" text-anchor="middle" font-size="17" fill="white">1</text><text x="112" y="233" font-size="23" font-weight="700" fill="#132c46">检测线芯</text><text x="72" y="278" font-size="19" fill="#455d70">DLDetection-CPU</text><text x="72" y="309" font-size="19" fill="#455d70">获取中心、类别、分数</text><text x="72" y="340" font-size="19" fill="#455d70">每种颜色选最高分</text><path d="M357 288 H386" stroke="#1b998b" stroke-width="3" marker-end="url(#a)"/><rect x="396" y="192" width="300" height="190" rx="16" fill="white" stroke="#d5e0e8"/><circle cx="431" cy="225" r="17" fill="#1b998b"/><text x="431" y="231" text-anchor="middle" font-size="17" fill="white">2</text><text x="460" y="233" font-size="23" font-weight="700" fill="#132c46">计算候选角度</text><text x="420" y="278" font-size="19" fill="#455d70">棕 → 黄中心连线方向</text><text x="420" y="309" font-size="19" fill="#455d70">计算水平旋转候选</text><text x="420" y="340" font-size="19" fill="#455d70">另计算相差 180° 候选</text><path d="M705 288 H734" stroke="#1b998b" stroke-width="3" marker-end="url(#a)"/><rect x="744" y="192" width="300" height="190" rx="16" fill="white" stroke="#d5e0e8"/><circle cx="779" cy="225" r="17" fill="#1b998b"/><text x="779" y="231" text-anchor="middle" font-size="17" fill="white">3</text><text x="808" y="233" font-size="23" font-weight="700" fill="#132c46">选择正确姿态</text><text x="768" y="278" font-size="19" fill="#455d70">比较旋转后绿 / 蓝高度</text><text x="768" y="309" font-size="19" fill="#455d70">优先让绿色位于蓝色上方</text><text x="768" y="340" font-size="19" fill="#455d70">再比较旋转角绝对值</text><path d="M1053 288 H1082" stroke="#1b998b" stroke-width="3" marker-end="url(#a)"/><rect x="1092" y="192" width="300" height="190" rx="16" fill="white" stroke="#d5e0e8"/><circle cx="1127" cy="225" r="17" fill="#1b998b"/><text x="1127" y="231" text-anchor="middle" font-size="17" fill="white">4</text><text x="1156" y="233" font-size="23" font-weight="700" fill="#132c46">输出控制提示</text><text x="1116" y="278" font-size="19" fill="#455d70">角度保留两位小数</text><text x="1116" y="309" font-size="19" fill="#455d70">顺时针 / 逆时针 / 无需</text><text x="1116" y="340" font-size="19" fill="#455d70">异常或缺色提示复检</text><rect x="48" y="420" width="1344" height="62" rx="12" fill="#dfedf1"/><text x="70" y="458" font-size="20" fill="#24465b">计算脚本输出角度与方向，不包含机械执行机构。运行界面示例：顺时针旋转 19.54°。</text></g></svg>
