<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="520" viewBox="0 0 1440 520" role="img" aria-label="工业视觉检测系统 · 总体结构"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#1b998b"/></marker></defs><rect width="1440" height="520" rx="24" fill="#f0f5f8"/><rect width="1440" height="145" rx="24" fill="#132c46"/><rect y="115" width="1440" height="30" fill="#132c46"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="54" y="66" font-size="34" font-weight="700" fill="white">工业视觉检测系统 · 总体结构</text><text x="54" y="111" font-size="20" fill="#bdd3e1">基于现有 VisionPlus 工程整理｜四项检测任务，共用一套运行界面</text><rect x="48" y="192" width="300" height="190" rx="16" fill="white" stroke="#d5e0e8"/><circle cx="83" cy="225" r="17" fill="#1b998b"/><text x="83" y="231" text-anchor="middle" font-size="17" fill="white">1</text><text x="112" y="233" font-size="23" font-weight="700" fill="#132c46">输入与触发</text><text x="72" y="278" font-size="19" fill="#455d70">文件夹图像输入</text><text x="72" y="309" font-size="19" fill="#455d70">内部触发 / 触发拍照</text><text x="72" y="340" font-size="19" fill="#455d70">四项任务接收图像</text><path d="M357 288 H386" stroke="#1b998b" stroke-width="3" marker-end="url(#a)"/><rect x="396" y="192" width="300" height="190" rx="16" fill="white" stroke="#d5e0e8"/><circle cx="431" cy="225" r="17" fill="#1b998b"/><text x="431" y="231" text-anchor="middle" font-size="17" fill="white">2</text><text x="460" y="233" font-size="23" font-weight="700" fill="#132c46">四项算法流程</text><text x="420" y="278" font-size="19" fill="#455d70">极片、线缆、手套、芯片</text><text x="420" y="309" font-size="19" fill="#455d70">分类 / 检测 + 几何计算</text><text x="420" y="340" font-size="19" fill="#455d70">默认启用 5 个模型</text><path d="M705 288 H734" stroke="#1b998b" stroke-width="3" marker-end="url(#a)"/><rect x="744" y="192" width="300" height="190" rx="16" fill="white" stroke="#d5e0e8"/><circle cx="779" cy="225" r="17" fill="#1b998b"/><text x="779" y="231" text-anchor="middle" font-size="17" fill="white">3</text><text x="808" y="233" font-size="23" font-weight="700" fill="#132c46">结果与数据分析</text><text x="768" y="278" font-size="19" fill="#455d70">缺陷判定与提示文字</text><text x="768" y="309" font-size="19" fill="#455d70">线缆旋转角度 / 方向</text><text x="768" y="340" font-size="19" fill="#455d70">芯片 X / Y 位置度</text><path d="M1053 288 H1082" stroke="#1b998b" stroke-width="3" marker-end="url(#a)"/><rect x="1092" y="192" width="300" height="190" rx="16" fill="white" stroke="#d5e0e8"/><circle cx="1127" cy="225" r="17" fill="#1b998b"/><text x="1127" y="231" text-anchor="middle" font-size="17" fill="white">4</text><text x="1156" y="233" font-size="23" font-weight="700" fill="#132c46">运行界面 HMI</text><text x="1116" y="278" font-size="19" fill="#455d70">四个图像显示窗口</text><text x="1116" y="309" font-size="19" fill="#455d70">结果标签 + 测量表</text><text x="1116" y="340" font-size="19" fill="#455d70">运行 / 停止与拍照入口</text><rect x="48" y="420" width="1344" height="62" rx="12" fill="#dfedf1"/><text x="70" y="458" font-size="20" fill="#24465b">结构依据：Main.page、各任务 XML 与 HMI 配置。箭头表达数据关系，不代表耗时或并行调度保证。</text></g></svg>
