<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="520" viewBox="0 0 1440 520" role="img" aria-label="01 · 极片焊点检测"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="#1b998b"/></marker></defs><rect width="1440" height="520" rx="24" fill="#f0f5f8"/><rect width="1440" height="145" rx="24" fill="#132c46"/><rect y="115" width="1440" height="30" fill="#132c46"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="54" y="66" font-size="34" font-weight="700" fill="white">01 · 极片焊点检测</text><text x="54" y="111" font-size="20" fill="#bdd3e1">默认启用的是分类分支；历史缺陷检测分支保留但停用</text><rect x="48" y="192" width="300" height="190" rx="16" fill="white" stroke="#d5e0e8"/><circle cx="83" cy="225" r="17" fill="#1b998b"/><text x="83" y="231" text-anchor="middle" font-size="17" fill="white">1</text><text x="112" y="233" font-size="23" font-weight="700" fill="#132c46">输入图像</text><text x="72" y="278" font-size="19" fill="#455d70">极片样本全幅图像</text><text x="72" y="309" font-size="19" fill="#455d70">文件夹按名称读取</text><text x="72" y="340" font-size="19" fill="#455d70">示例覆盖合格与缺陷</text><path d="M357 288 H386" stroke="#1b998b" stroke-width="3" marker-end="url(#a)"/><rect x="396" y="192" width="300" height="190" rx="16" fill="white" stroke="#d5e0e8"/><circle cx="431" cy="225" r="17" fill="#1b998b"/><text x="431" y="231" text-anchor="middle" font-size="17" fill="white">2</text><text x="460" y="233" font-size="23" font-weight="700" fill="#132c46">V+ 分类模型</text><text x="420" y="278" font-size="19" fill="#455d70">DLClassify-CPU</text><text x="420" y="309" font-size="19" fill="#455d70">采用原导出模型</text><text x="420" y="340" font-size="19" fill="#455d70">不改训练权重与阈值</text><path d="M705 288 H734" stroke="#1b998b" stroke-width="3" marker-end="url(#a)"/><rect x="744" y="192" width="300" height="190" rx="16" fill="white" stroke="#d5e0e8"/><circle cx="779" cy="225" r="17" fill="#1b998b"/><text x="779" y="231" text-anchor="middle" font-size="17" fill="white">3</text><text x="808" y="233" font-size="23" font-weight="700" fill="#132c46">判定与文字</text><text x="768" y="278" font-size="19" fill="#455d70">分类输出逻辑运算</text><text x="768" y="309" font-size="19" fill="#455d70">映射合格 / 缺陷提示</text><text x="768" y="340" font-size="19" fill="#455d70">保留原工程映射</text><path d="M1053 288 H1082" stroke="#1b998b" stroke-width="3" marker-end="url(#a)"/><rect x="1092" y="192" width="300" height="190" rx="16" fill="white" stroke="#d5e0e8"/><circle cx="1127" cy="225" r="17" fill="#1b998b"/><text x="1127" y="231" text-anchor="middle" font-size="17" fill="white">4</text><text x="1156" y="233" font-size="23" font-weight="700" fill="#132c46">结果展示</text><text x="1116" y="278" font-size="19" fill="#455d70">建立结果图像记录</text><text x="1116" y="309" font-size="19" fill="#455d70">HMI 显示检测图像</text><text x="1116" y="340" font-size="19" fill="#455d70">展示极片焊点结论</text><rect x="48" y="420" width="1344" height="62" rx="12" fill="#dfedf1"/><text x="70" y="458" font-size="20" fill="#24465b">赛题缺陷：漏焊、多焊、焊偏、焊穿、极片偏移。示例插图用于说明任务，分类效果需整集复测。</text></g></svg>
